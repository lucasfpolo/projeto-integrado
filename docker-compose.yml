services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-iotdb}
      POSTGRES_USER: ${DB_USER:-iot_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-iot_password}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-iot_user} -d ${DB_NAME:-iotdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pi_network

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: simulator
    environment:
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT}
      MQTT_USE_TLS: ${MQTT_USE_TLS}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX}
      PUBLISH_INTERVAL: ${PUBLISH_INTERVAL}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      N_SENSORES: ${N_SENSORES}
    volumes:
      - ./simulator:/app
    networks:
      - pi_network

  mqtt-consumer:
    build:
      context: ./mqtt_consumer
      dockerfile: Dockerfile
    container_name: mqtt_consumer
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_USE_TLS: ${MQTT_USE_TLS}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX}
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-iotdb}
      DB_USER: ${DB_USER:-iot_user}
      DB_PASSWORD: ${DB_PASSWORD:-iot_password}
    volumes:
      - ./mqtt_consumer:/app
    networks:
      - pi_network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: temp_fastapi
    restart: unless-stopped
    ports:
      - "${API_PORT:-8001}:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-iotdb}
      DB_USER: ${DB_USER:-iot_user}
      DB_PASSWORD: ${DB_PASSWORD:-iot_password}
    volumes:
      - ./api:/app
    networks:
      - pi_network

volumes:
  timescaledb_data:

networks:
  pi_network:
    driver: bridge